<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Appointments — SupportGent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* ── Page layout ──────────────────────────────────────────────── */
.page-content { padding: 20px 24px 48px; max-width: 1100px; }

/* ── Stats bar ────────────────────────────────────────────────── */
.stats-bar { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 24px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.stat-icon { font-size: 20px; margin-bottom: 4px; }
.stat-label { font-size: 11.5px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
.stat-value { font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -.04em; line-height: 1; }

/* ── Toolbar ──────────────────────────────────────────────────── */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.filter-tabs { display: flex; gap: 4px; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.ftab { height: 30px; padding: 0 14px; border-radius: 8px; font-family: var(--font); font-size: 12.5px; font-weight: 700; cursor: pointer; border: none; background: transparent; color: var(--text-3); transition: var(--t); }
.ftab.active { background: var(--surface); color: var(--text); box-shadow: var(--sh-sm); }
.search-wrap { position: relative; }
.search-wrap::before { content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; pointer-events: none; }
.search-input { height: 34px; padding: 0 12px 0 32px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); color: var(--text); font-family: var(--font); font-size: 13px; outline: none; width: 200px; transition: var(--t); }
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }

/* ── Table ────────────────────────────────────────────────────── */
.appt-table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.appt-table { width: 100%; border-collapse: collapse; }
.appt-table th { padding: 10px 16px; text-align: left; font-size: 11.5px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
.appt-table td { padding: 13px 16px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border); vertical-align: middle; }
.appt-table tr:last-child td { border-bottom: none; }
.appt-table tbody tr { transition: background .12s; }
.appt-table tbody tr:hover { background: var(--surface-2); }
.customer-name { font-weight: 700; }
.customer-contact { font-size: 12px; color: var(--text-3); margin-top: 2px; display: flex; align-items: center; gap: 4px; }
.service-text { color: var(--text-2); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.dt-date { font-weight: 600; }
.dt-time { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.sent-chips { display: flex; gap: 4px; flex-wrap: wrap; }
.sent-chip { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; }
.chip-yes { background: #10b98120; color: #059669; }
.chip-no { background: var(--surface-2); color: var(--text-3); }
.row-actions { display: flex; gap: 6px; }
.icon-btn { width: 30px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 7px; background: transparent; border: 1px solid var(--border); cursor: pointer; font-size: 14px; color: var(--text-2); transition: var(--t); }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }

/* ── Status pill ──────────────────────────────────────────────── */
.status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
.s-pending   { background: #f59e0b18; color: #d97706; }
.s-confirmed { background: #3b82f618; color: #2563eb; }
.s-completed { background: #10b98118; color: #059669; }
.s-cancelled { background: #ef444418; color: #dc2626; }

/* ── Empty / pagination ───────────────────────────────────────── */
.empty-state { padding: 60px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty-icon { font-size: 40px; }
.empty-title { font-size: 15px; font-weight: 700; color: var(--text); }
.empty-sub { font-size: 13px; color: var(--text-3); max-width: 360px; line-height: 1.6; }
.pagination { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
.pagination span { font-size: 12.5px; color: var(--text-3); font-weight: 600; }

/* ── Modal ────────────────────────────────────────────────────── */
.modal-backdrop { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.45); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; }
.modal-backdrop.open { opacity: 1; visibility: visible; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: var(--sh-lg); transform: scale(.96) translateY(8px); transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
.modal-backdrop.open .modal { transform: scale(1) translateY(0); }
.modal-head { padding: 20px 22px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.modal-title { font-size: 16px; font-weight: 800; color: var(--text); letter-spacing: -.03em; }
.modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-3); padding: 4px; border-radius: 8px; line-height: 1; }
.modal-close:hover { background: var(--surface-2); }
.modal-body { padding: 16px 22px 22px; }
.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.form-label { font-size: 12.5px; font-weight: 700; color: var(--text-2); }
.form-label small { font-weight: 500; color: var(--text-3); }
.form-input, .form-select, .form-textarea { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2); color: var(--text); font-family: var(--font); font-size: 13px; outline: none; box-sizing: border-box; transition: var(--t); }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); background: var(--surface); }
.form-textarea { height: 80px; padding: 10px 12px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }

@media(max-width: 900px) {
  .stats-bar { grid-template-columns: repeat(2,1fr); }
  .appt-table th:nth-child(5), .appt-table td:nth-child(5) { display: none; }
}
@media(max-width: 640px) {
  .form-row { grid-template-columns: 1fr; }
  .search-input { width: 140px; }
  .page-content { padding: 12px 14px 40px; }
}
</style>
<script>
;(function(){
  var p = new URLSearchParams(location.search), t = p.get('token');
  if (t) { localStorage.setItem('sg_token', t); history.replaceState({}, '', location.pathname); }
  var dark = localStorage.getItem('sg_theme') === 'dark';
  document.documentElement[dark ? 'setAttribute' : 'removeAttribute']('data-theme', 'dark');
  document.documentElement.style.background = dark ? '#07080D' : '#F2F3F9';
})();
</script>
<script src="i18n.js"></script>
<script src="api.js"></script>
<script src="nav.js"></script>
</head>
<body>

<div id="toast-container"></div>

<div class="mobile-topbar">
  <div class="mob-left">
    <button class="hamburger" onclick="openMobileSidebar()">
      <svg viewBox="0 0 16 16"><line x1="1" y1="4" x2="15" y2="4"/><line x1="1" y1="8" x2="15" y2="8"/><line x1="1" y1="12" x2="15" y2="12"/></svg>
    </button>
    <a class="mob-logo" href="home.html">Support<span>Gent</span></a>
  </div>
  <div class="mob-right"><button class="theme-toggle"></button></div>
</div>

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeMobileSidebar()"></div>
<div class="sidebar" id="sidebar"></div>

<div id="page-skeleton">
  <div class="skel-topbar">
    <div class="skel" style="height:12px;width:160px;border-radius:4px"></div>
    <div class="skel" style="height:32px;width:160px;border-radius:var(--r-sm)"></div>
  </div>
  <div class="skel-body">
    <div class="skel" style="height:120px;border-radius:var(--r-lg);margin-bottom:16px"></div>
    <div class="skel" style="height:400px;border-radius:var(--r-lg)"></div>
  </div>
</div>

<div class="main-wrap">
  <div class="topbar">
    <div class="topbar-left">
      <div>
        <div class="topbar-title">📅 Appointments</div>
        <div class="topbar-subtitle" id="page-sub">Loading…</div>
      </div>
    </div>
    <div class="topbar-right">
      <select class="agent-sel" id="agent-sel" onchange="onAgentChange()">
        <option value="">— Select agent —</option>
      </select>
      <button class="theme-toggle"></button>
    </div>
  </div>

  <div class="content page-content" id="page-content" style="display:none">

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-icon">📋</div><div class="stat-label">Total</div><div class="stat-value" id="stat-total">—</div></div>
      <div class="stat-card"><div class="stat-icon">⏳</div><div class="stat-label">Pending</div><div class="stat-value" id="stat-pending">—</div></div>
      <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-label">Confirmed</div><div class="stat-value" id="stat-confirmed">—</div></div>
      <div class="stat-card"><div class="stat-icon">🎉</div><div class="stat-label">Completed</div><div class="stat-value" id="stat-completed">—</div></div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="filter-tabs">
          <button class="ftab active" data-filter="all"       onclick="setFilter('all')">All</button>
          <button class="ftab"        data-filter="pending"   onclick="setFilter('pending')">⏳ Pending</button>
          <button class="ftab"        data-filter="confirmed" onclick="setFilter('confirmed')">✅ Confirmed</button>
          <button class="ftab"        data-filter="completed" onclick="setFilter('completed')">🎉 Completed</button>
          <button class="ftab"        data-filter="cancelled" onclick="setFilter('cancelled')">❌ Cancelled</button>
        </div>
        <div class="search-wrap">
          <input class="search-input" id="search-input" placeholder="Search customer…" oninput="onSearch()"/>
        </div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openCreateModal()">＋ Add Appointment</button>
    </div>

    <!-- Table -->
    <div class="appt-table-wrap">
      <table class="appt-table">
        <thead>
          <tr>
            <th>Customer</th>
            <th>Service</th>
            <th>Scheduled</th>
            <th>Status</th>
            <th>Notifications</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="appt-body"></tbody>
      </table>
      <div class="pagination" id="pagination" style="display:none">
        <span id="pag-info"></span>
        <button class="btn btn-secondary btn-sm" id="prev-btn" onclick="changePage(-1)">← Prev</button>
        <button class="btn btn-secondary btn-sm" id="next-btn" onclick="changePage(1)">Next →</button>
      </div>
    </div>

  </div><!-- /page-content -->
</div><!-- /main-wrap -->

<!-- Create/Edit Modal -->
<div class="modal-backdrop" id="appt-modal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modal-title">Add Appointment</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Customer Name *</label>
          <input class="form-input" id="f-name" placeholder="e.g. Ravi Kumar"/>
        </div>
        <div class="form-group">
          <label class="form-label">Channel</label>

            <option value="manual">Manual</option>
            <option value="whatsapp">WhatsApp</option>

      <div class="form-group">
        <label class="form-label">Service / Reason</label>
        <input class="form-input" id="f-service" placeholder="e.g. Haircut, Consultation, Demo"/>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Date</label>
          <input class="form-input" id="f-date" type="date"/>
        </div>
        <div class="form-group">
          <label class="form-label">Time</label>
          <input class="form-input" id="f-time" type="time"/>

      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="f-status">
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>

      </div>

        <label class="form-label">Notes <small>(optional)</small></label>
        <textarea class="form-textarea" id="f-notes" placeholder="Any extra details…"></textarea>
      </div>

        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="save-btn" onclick="saveAppointment()">Save Appointment</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal-backdrop" id="delete-modal">
  <div class="modal" style="max-width:380px">
    <div class="modal-head">
      <div class="modal-title">Delete Appointment?</div>
      <button class="modal-close" onclick="closeDeleteModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13.5px;color:var(--text-2);line-height:1.7;margin:0 0 20px">This will permanently remove the appointment. This cannot be undone.</p>
      <div class="modal-actions" style="margin-top:0;padding-top:0;border-top:none">
        <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn btn-danger" id="confirm-del-btn" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>
</div>

<script>
var _agentId       = null
var _all           = []
var _filtered      = []
var _filter        = 'all'
var _search        = ''
var _editingId     = null
var _deleteId      = null
var _page          = 0
var PAGE_SIZE      = 25

// ── Init ──────────────────────────────────────────────────────────
async function init() {
  const { user } = await renderNav('appointments')
  if (!user) return
  await loadAgents()
  document.getElementById('page-skeleton').style.display = 'none'
  document.getElementById('page-content').style.display  = 'block'
}

async function loadAgents() {
  try {
    const d   = await apiFetch('/agents')
    const sel = document.getElementById('agent-sel')
    sel.innerHTML = '<option value="">— Select agent —</option>'
    ;(d.agents || d || []).forEach(a => {
      const o = document.createElement('option')
      o.value = a._id; o.textContent = a.name || 'Unnamed'
      sel.appendChild(o)
    })
    const stored = localStorage.getItem('sg_appt_agent')
    if (stored) sel.value = stored
    if (!sel.value && sel.options.length > 1) sel.value = sel.options[1].value
    if (sel.value) { _agentId = sel.value; await loadAppointments() }
  } catch(e) { toast('Failed to load agents: ' + e.message, 'error') }
}

function onAgentChange() {
  _agentId = document.getElementById('agent-sel').value
  if (_agentId) { localStorage.setItem('sg_appt_agent', _agentId); loadAppointments() }
}

// ── Load ──────────────────────────────────────────────────────────
async function loadAppointments() {
  if (!_agentId) return
  try {
    const d = await apiFetch('/appointments?agent_id=' + _agentId + '&limit=500')
    _all = d.appointments || []
    updateStats()
    applyFilter()
    document.getElementById('page-sub').textContent = _all.length + ' appointment' + (_all.length !== 1 ? 's' : '')
  } catch(e) {
    toast('Failed to load appointments: ' + e.message, 'error')
    document.getElementById('page-sub').textContent = 'Error loading'
    document.getElementById('appt-body').innerHTML = '<tr><td colspan="6">' + emptyHTML('⚠️','Could not load appointments','Try refreshing the page.') + '</td></tr>'
  }
}

function updateStats() {
  var counts = { pending:0, confirmed:0, completed:0, cancelled:0 }
  _all.forEach(function(a){ if (counts[a.status] !== undefined) counts[a.status]++ })
  document.getElementById('stat-total').textContent     = _all.length
  document.getElementById('stat-pending').textContent   = counts.pending
  document.getElementById('stat-confirmed').textContent = counts.confirmed
  document.getElementById('stat-completed').textContent = counts.completed
}

// ── Filter / search ───────────────────────────────────────────────
function setFilter(f) {
  _filter = f; _page = 0
  document.querySelectorAll('.ftab').forEach(function(b){ b.classList.toggle('active', b.dataset.filter === f) })
  applyFilter()
}

function onSearch() {
  _search = document.getElementById('search-input').value.toLowerCase().trim()
  _page = 0
  applyFilter()
}

function applyFilter() {
  _filtered = _all.filter(function(a) {
    if (_filter !== 'all' && a.status !== _filter) return false
    if (_search) {
      var hay = [a.customer_name, a.customer_phone, a.customer_email, a.service].join(' ').toLowerCase()
      if (hay.indexOf(_search) === -1) return false
    }
    return true
  })
  renderTable()
}

// ── Render ────────────────────────────────────────────────────────
function renderTable() {
  var tbody = document.getElementById('appt-body')
  var pag   = document.getElementById('pagination')

  if (!_filtered.length) {
    var msgs = {
      all:       ['📅','No appointments yet','Appointments detected by your AI or added manually will appear here.'],
      pending:   ['⏳','No pending appointments','All caught up!'],
      confirmed: ['✅','No confirmed appointments',''],
      completed: ['🎉','No completed appointments',''],
      cancelled: ['❌','No cancelled appointments',''],
    }
    var m = msgs[_filter] || msgs.all
    tbody.innerHTML = '<tr><td colspan="6">' + emptyHTML(m[0],m[1],m[2]) + '</td></tr>'
    pag.style.display = 'none'
    return
  }

  var start = _page * PAGE_SIZE
  var slice = _filtered.slice(start, start + PAGE_SIZE)
  var icons = { whatsapp:'💬', gmail:'📧', instagram:'📸', messenger:'💙', manual:'✏️' }
  var scls  = { pending:'s-pending', confirmed:'s-confirmed', completed:'s-completed', cancelled:'s-cancelled' }

  tbody.innerHTML = slice.map(function(a) {
    var icon    = icons[a.channel] || '📋'
    var contact = a.customer_phone || a.customer_email || ''
    var dt      = fmtDT(a.scheduled_at)
    var scl     = scls[a.status] || 's-pending'
    return '<tr>'
      + '<td><div class="customer-name">' + esc(a.customer_name||'—') + '</div>'
      +   '<div class="customer-contact"><span>' + icon + '</span>' + esc(contact||a.channel) + '</div></td>'
      + '<td><span class="service-text" title="' + esc(a.service||'') + '">' + esc(a.service||'—') + '</span></td>'
      + '<td><div class="dt-date">' + dt.date + '</div>' + (dt.time ? '<div class="dt-time">' + dt.time + '</div>' : '') + '</td>'
      + '<td><span class="status-pill ' + scl + '">' + cap(a.status) + '</span></td>'
      + '<td><div class="sent-chips">'
      +   '<span class="sent-chip ' + (a.reminder_sent ? 'chip-yes' : 'chip-no') + '">🔔 ' + (a.reminder_sent ? 'Sent' : 'Pending') + '</span>'
      +   '<span class="sent-chip ' + (a.followup_sent ? 'chip-yes' : 'chip-no') + '">📨 ' + (a.followup_sent ? 'Sent' : 'Pending') + '</span>'
      + '</div></td>'
      + '<td><div class="row-actions">'
      +   '<button class="icon-btn" title="Edit" onclick="openEditModal(\'' + a._id + '\')">✏️</button>'
      +   '<button class="icon-btn" title="Delete" onclick="openDeleteModal(\'' + a._id + '\')" style="color:#ef4444">🗑️</button>'
      + '</div></td>'
      + '</tr>'
  }).join('')

  if (_filtered.length > PAGE_SIZE) {
    pag.style.display = 'flex'
    var pages = Math.ceil(_filtered.length / PAGE_SIZE)
    document.getElementById('pag-info').textContent = (start+1) + '–' + Math.min(start+PAGE_SIZE,_filtered.length) + ' of ' + _filtered.length
    document.getElementById('prev-btn').disabled = _page === 0
    document.getElementById('next-btn').disabled = _page >= pages - 1
  } else {
    pag.style.display = 'none'
  }
}

function changePage(dir) { _page = Math.max(0, _page + dir); renderTable() }

function emptyHTML(icon, title, sub) {
  return '<div class="empty-state"><div class="empty-icon">' + icon + '</div>'
    + '<div class="empty-title">' + title + '</div>'
    + (sub ? '<div class="empty-sub">' + sub + '</div>' : '')
    + '</div>'
}

// ── Create / Edit modal ───────────────────────────────────────────
function openCreateModal() {
  _editingId = null
  document.getElementById('modal-title').textContent = 'Add Appointment'
  document.getElementById('save-btn').textContent    = 'Save Appointment'
  clearForm()
  document.getElementById('appt-modal').classList.add('open')
}

function openEditModal(id) {
  var a = _all.find(function(x){ return x._id === id })
  if (!a) return
  _editingId = id
  document.getElementById('modal-title').textContent = 'Edit Appointment'
  document.getElementById('save-btn').textContent    = 'Save Changes'
  document.getElementById('f-name').value    = a.customer_name || ''
  document.getElementById('f-phone').value   = a.customer_phone || ''
  document.getElementById('f-email').value   = a.customer_email || ''
  document.getElementById('f-service').value = a.service || ''
  document.getElementById('f-notes').value   = a.notes || ''
  document.getElementById('f-status').value  = a.status || 'pending'
  document.getElementById('f-channel').value = a.channel || 'manual'
  if (a.scheduled_at) {
    var d = new Date(a.scheduled_at)
    document.getElementById('f-date').value = d.toISOString().slice(0,10)
    document.getElementById('f-time').value = d.toISOString().slice(11,16)
  } else {
    document.getElementById('f-date').value = ''
    document.getElementById('f-time').value = ''
  }
  document.getElementById('appt-modal').classList.add('open')
}

function closeModal() { document.getElementById('appt-modal').classList.remove('open'); _editingId = null }

function clearForm() {
  ['f-name','f-phone','f-email','f-service','f-notes','f-date','f-time'].forEach(function(id){ document.getElementById(id).value = '' })
  document.getElementById('f-status').value  = 'pending'
  document.getElementById('f-channel').value = 'manual'
}

function openDeleteModal(id) { _deleteId = id; document.getElementById('delete-modal').classList.add('open') }
function closeDeleteModal()  { document.getElementById('delete-modal').classList.remove('open'); _deleteId = null }

// ── Save ──────────────────────────────────────────────────────────
async function saveAppointment() {
  var name = document.getElementById('f-name').value.trim()
  if (!name) { toast('Customer name is required', 'error'); return }

  var dateVal = document.getElementById('f-date').value
  var timeVal = document.getElementById('f-time').value
  var scheduled_at = null
  if (dateVal) scheduled_at = timeVal ? new Date(dateVal + 'T' + timeVal).toISOString() : new Date(dateVal).toISOString()

  var body = {
    agent_id:       _agentId,
    customer_name:  name,
    customer_phone: document.getElementById('f-phone').value.trim() || null,
    customer_email: document.getElementById('f-email').value.trim() || null,
    service:        document.getElementById('f-service').value.trim(),
    notes:          document.getElementById('f-notes').value.trim(),
    status:         document.getElementById('f-status').value,
    channel:        document.getElementById('f-channel').value,
    scheduled_at:   scheduled_at,
  }

  var btn = document.getElementById('save-btn')
  btn.disabled = true
  try {
    if (_editingId) {
      await apiFetch('/appointments/' + _editingId, { method: 'PATCH', body: JSON.stringify(body) })
      toast('Appointment updated', 'success')
    } else {
      await apiFetch('/appointments', { method: 'POST', body: JSON.stringify(body) })
      toast('Appointment created', 'success')
    }
    closeModal()
    await loadAppointments()
  } catch(e) {
    toast(e.message || 'Failed to save', 'error')
  } finally {
    btn.disabled = false
  }
}

// ── Delete ────────────────────────────────────────────────────────
async function confirmDelete() {
  if (!_deleteId) return
  var btn = document.getElementById('confirm-del-btn')
  btn.disabled = true
  try {
    await apiFetch('/appointments/' + _deleteId, { method: 'DELETE' })
    toast('Appointment deleted', 'success')
    closeDeleteModal()
    await loadAppointments()
  } catch(e) {
    toast(e.message || 'Failed to delete', 'error')
  } finally {
    btn.disabled = false
  }
}

// ── Utilities ─────────────────────────────────────────────────────
function fmtDT(iso) {
  if (!iso) return { date: '—', time: '' }
  try {
    var d = new Date(iso)
    return {
      date: d.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }),
      time: d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' }),
    }
  } catch(e) { return { date: '—', time: '' } }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : '' }

function toast(msg, type) {
  type = type || 'info'
  var c = document.getElementById('toast-container')
  var el = document.createElement('div')
  el.className = 'toast toast-' + type
  el.textContent = msg
  c.appendChild(el)
  setTimeout(function(){ el.classList.add('hide'); setTimeout(function(){ el.remove() }, 300) }, 3200)
}

init()
</script>
